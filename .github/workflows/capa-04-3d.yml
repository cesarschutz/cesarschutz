# Capa 04 · Trajetória — gera o gráfico 3D de contribuições em profile-3d-contrib/.
name: capa-04 · contribuições 3D

on:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Os workflows de capa fazem commit na main: um espera o outro terminar.
concurrency:
  group: commit-na-main
  cancel-in-progress: false

jobs:
  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore(capa-04): atualiza contribuições 3D"
          git pull --rebase origin main
          git push

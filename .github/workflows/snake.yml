# Gera a cobrinha do gráfico de contribuições (claro e escuro) em assets/.
name: snake

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-na-main
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=#5a5fc8
            assets/snake-dark.svg?palette=github-dark&color_snake=#b1b9f9
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake-*.svg
          git diff --cached --quiet || git commit -m "chore: atualiza snake"
          git pull --rebase origin main
          git push

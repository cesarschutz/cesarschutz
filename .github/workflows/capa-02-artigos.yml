# Capa 02 · Caderno — atualiza a seção "Últimas páginas" com o RSS do blog.
name: capa-02 · últimos artigos

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Os dois workflows de capa fazem commit na main: um espera o outro terminar.
concurrency:
  group: commit-na-main
  cancel-in-progress: false

jobs:
  artigos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.cesarschutz.com.br/rss.xml"
          readme_path: "./capas/02-caderno/README.md"
          max_post_count: 6
          template: "- `$date` · [$title]($url)$newline"
          date_format: "dd/mm/yyyy"
          tag_post_pre_newline: true
          commit_message: "chore(capa-02): atualiza últimos artigos"

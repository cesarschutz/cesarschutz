<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Cesar Schutz — caderno de engenharia: o que eu estudo virando artigo.">
<title>Cesar Schutz — caderno de engenharia: o que eu estudo virando artigo.</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",Times,serif}
.b{font-weight:700}
.i{font-style:italic}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.f{animation:in .45s ease-out both}
.u{animation:up .6s ease-out both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<defs><clipPath id="caderno-pen"><rect x="120" y="90" height="90" width="0"><animate attributeName="width" from="0" to="440" begin=".3s" dur="1.2s" fill="freeze"/></rect></clipPath></defs>
<rect width="1200" height="400" rx="16" fill="#15191f"/>
<path d="M0 80H1200" stroke="#252b34"/>
<path d="M0 120H1200" stroke="#252b34"/>
<path d="M0 160H1200" stroke="#252b34"/>
<path d="M0 200H1200" stroke="#252b34"/>
<path d="M0 240H1200" stroke="#252b34"/>
<path d="M0 280H1200" stroke="#252b34"/>
<path d="M0 320H1200" stroke="#252b34"/>
<path d="M0 360H1200" stroke="#252b34"/>
<path d="M100 0V400" stroke="#6e3a3a" stroke-width="2"/>
<circle cx="46" cy="100" r="11" fill="#0d1117"/>
<circle cx="46" cy="200" r="11" fill="#0d1117"/>
<circle cx="46" cy="300" r="11" fill="#0d1117"/>
<text x="128" y="56" font-size="14" fill="#a0977f" class="mono" letter-spacing="2" textLength="176.4" lengthAdjust="spacing" xml:space="preserve">CADERNO DE ENGENHARIA</text>
<text x="126" y="158" font-size="64" fill="#ece6da" class="serif b" clip-path="url(#caderno-pen)">Cesar Schutz</text>
<path d="M128 176c80 6 190 -2 300 -4c40 0 90 2 126 6" fill="none" stroke="#79b8ff" stroke-width="3" stroke-linecap="round" pathLength="1" class="draw" style="animation-delay:1.50s"/>
<rect x="124" y="213" width="0" height="34" rx="4" fill="#6b5310" opacity=".7"><animate attributeName="width" from="0" to="430" begin="2.1s" dur=".7s" fill="freeze"/></rect>
<text x="128" y="239" font-size="30" fill="#ece6da" class="serif i f" style="animation-delay:1.90s">O que eu estudo virando artigo.</text>
<g class="f" style="animation-delay:2.60s"><text x="128" y="278" font-size="18" fill="#a0977f" class="mono"  textLength="507.6" lengthAdjust="spacing" xml:space="preserve">Arquiteto de soluções · Java · arquitetura · IA</text></g>
<g class="f" style="animation-delay:2.80s"><text x="128" y="358" font-size="17" fill="#79b8ff" class="mono"  textLength="255.0" lengthAdjust="spacing" xml:space="preserve">→ blog.cesarschutz.com.br</text></g>
<g transform="rotate(-1.6 954.0 207.0)"><rect x="777" y="73" width="368" height="286" rx="6" fill="#000000" opacity=".45"/><rect x="770" y="64" width="368" height="286" rx="6" fill="#1c222b" stroke="#252b34"/><path d="M770 116H1138" stroke="#c0504d" stroke-width="1.5" opacity=".7"/><text x="792" y="98" font-size="14" fill="#a0977f" class="mono"  textLength="218.4" lengthAdjust="spacing" xml:space="preserve">estudado, testado, escrito</text><path d="M794 150l5 5l10 -11" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="animation-delay:3.00s;animation-duration:.35s"/><text x="822" y="156" font-size="20" fill="#ece6da" class="serif i f" style="animation-delay:2.90s">chave de idempotência</text><path d="M794 184l5 5l10 -11" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="animation-delay:3.32s;animation-duration:.35s"/><text x="822" y="190" font-size="20" fill="#ece6da" class="serif i f" style="animation-delay:3.22s">outbox e relay</text><path d="M794 218l5 5l10 -11" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="animation-delay:3.64s;animation-duration:.35s"/><text x="822" y="224" font-size="20" fill="#ece6da" class="serif i f" style="animation-delay:3.54s">traceparent</text><path d="M794 252l5 5l10 -11" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="animation-delay:3.96s;animation-duration:.35s"/><text x="822" y="258" font-size="20" fill="#ece6da" class="serif i f" style="animation-delay:3.86s">virtual threads</text><path d="M794 286l5 5l10 -11" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="draw" style="animation-delay:4.28s;animation-duration:.35s"/><text x="822" y="292" font-size="20" fill="#ece6da" class="serif i f" style="animation-delay:4.18s">ledger e conciliação</text><g class="f" style="animation-delay:4.60s"><circle cx="801" cy="319" r="4" fill="#79b8ff" class="pulse"/><text x="822" y="326" font-size="20" fill="#79b8ff" class="serif i">agentes e Claude Code</text><rect x="1032" y="307" width="2.5" height="24" fill="#79b8ff" class="blink"/></g></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Cesar Schutz, arquiteto de soluções. Linha do tempo de 2011 até hoje: estágio em Java de 2011 a 2013, desenvolvedor Java SE em 2013, Java EE e JSF em 2015, microsserviços em 2017, plataforma de cartões como dev sênior em 2019, líder técnico em 2020, arquiteto de soluções desde 2021 e programa de fidelidade desde 2025. Formação: tecnólogo em ADS (2013–2019), pós em engenharia de software (2021–2022), MBAs em arquitetura de software e em engenharia de software com IA (2025–2026); certificação Agile Scrum Foundation (2018).">
<title>Cesar Schutz, arquiteto de soluções. Linha do tempo de 2011 até hoje: estágio em Java de 2011 a 2013, desenvolvedor Java SE em 2013, Java EE e JSF em 2015, microsserviços em 2017, plataforma de cartões como dev sênior em 2019, líder técnico em 2020, arquiteto de soluções desde 2021 e programa de fidelidade desde 2025. Formação: tecnólogo em ADS (2013–2019), pós em engenharia de software (2021–2022), MBAs em arquitetura de software e em engenharia de software com IA (2025–2026); certificação Agile Scrum Foundation (2018).</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}

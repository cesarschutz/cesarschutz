<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 135 26" width="135" height="26" role="img" aria-label="status: experimento">
<title>status: experimento</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",Times,serif}
.b{font-weight:700}
.i{font-style:italic}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.f{animation:in .45s ease-out both}
.u{animation:up .6s ease-out both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<defs></defs>
<rect x=".5" y=".5" width="134" height="25" rx="12.5" fill="#161b22" stroke="#30363d"/>
<circle cx="16" cy="13" r="4.5" fill="#58a6ff"/>
<text x="28" y="17.5" font-size="13" fill="#e6edf3" class="mono"  textLength="85.8" lengthAdjust="spacing" xml:space="preserve">experimento</text>
</svg>

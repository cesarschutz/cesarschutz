<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 48" width="288" height="48" role="img" aria-label="Kafka, SNS/SQS, MongoDB, PostgreSQL, DynamoDB">
<title>Kafka, SNS/SQS, MongoDB, PostgreSQL, DynamoDB</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",Times,serif}
.b{font-weight:700}
.i{font-style:italic}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.f{animation:in .45s ease-out both}
.u{animation:up .6s ease-out both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}

@keyframes pop{0%{opacity:0;transform:scale(.55)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
<defs></defs>
<image href="data:image/svg+xml;base64," x="0.0" y="0.0" width="48" height="48" class="pop" style="animation-delay:0.10s" />
<image href="data:image/svg+xml;base64," x="60.0" y="0.0" width="48" height="48" class="pop" style="animation-delay:0.16s" />
<image href="data:image/svg+xml;base64," x="120.0" y="0.0" width="48" height="48" class="pop" style="animation-delay:0.22s" />
<image href="data:image/svg+xml;base64," x="180.0" y="0.0" width="48" height="48" class="pop" style="animation-delay:0.28s" />
<image href="data:image/svg+xml;base64," x="240.0" y="0.0" width="48" height="48" class="pop" style="animation-delay:0.34s" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Linha do tempo de 2011 até hoje: estágio em Java de 2011 a 2013, desenvolvedor Java SE em 2013, Java EE e JSF em 2015, microsserviços em 2017, plataforma de cartões como dev sênior em 2019, líder técnico em 2020, arquiteto de software e soluções desde 2021 e programa de fidelidade desde 2025. Formação: tecnólogo em ADS, pós em engenharia de software, MBAs em arquitetura de software e em engenharia de software com IA; certificação Agile Scrum Foundation (2018).">
<title>Linha do tempo de 2011 até hoje: estágio em Java de 2011 a 2013, desenvolvedor Java SE em 2013, Java EE e JSF em 2015, microsserviços em 2017, plataforma de cartões como dev sênior em 2019, líder técnico em 2020, arquiteto de software e soluções desde 2021 e programa de fidelidade desde 2025. Formação: tecnólogo em ADS, pós em engenharia de software, MBAs em arquitetura de software e em engenharia de software com IA; certificação Agile Scrum Foundation (2018).</title>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:Georgia,"Times New Roman",Times,serif}
.b{font-weight:700}
.i{font-style:italic}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.f{animation:in .45s ease-out both}
.u{animation:up .6s ease-out both}
.blink{animation:blink 1.05s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}

@keyframes pop{0%{opacity:0;transform:scale(.55)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
</style>
